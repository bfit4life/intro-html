<svg width="2560" height="1440" viewBox="0 0 2560 1440" xmlns="http://www.w3.org/2000/svg">
  <defs>

    <!-- Herringbone traction pattern texture -->
    <pattern id="traction" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse">
      <rect width="48" height="48" fill="none"/>
      <polyline points="0,24 12,0 24,24 36,0 48,24" fill="none" stroke="#2A2A2A" stroke-width="2.5" stroke-linejoin="round"/>
      <polyline points="0,48 12,24 24,48 36,24 48,48" fill="none" stroke="#2A2A2A" stroke-width="2.5" stroke-linejoin="round"/>
    </pattern>

    <!-- Background gradient: darkest at edges, richest at center -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#080808"/>
      <stop offset="30%"  stop-color="#161616"/>
      <stop offset="50%"  stop-color="#1E1E1E"/>
      <stop offset="70%"  stop-color="#161616"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>

    <!-- Vertical gradient: darker top and bottom -->
    <linearGradient id="vGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#000000" stop-opacity="0.6"/>
      <stop offset="35%"  stop-color="#000000" stop-opacity="0"/>
      <stop offset="65%"  stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Orange heat glow — centered on safe zone -->
    <radialGradient id="heatGlow" cx="50%" cy="50%" r="40%" fx="50%" fy="50%">
      <stop offset="0%"   stop-color="#C4600A" stop-opacity="0.18"/>
      <stop offset="60%"  stop-color="#C4600A" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#C4600A" stop-opacity="0"/>
    </radialGradient>

    <!-- Gold shimmer on accent line -->
    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#C4933A" stop-opacity="0"/>
      <stop offset="20%"  stop-color="#C4933A" stop-opacity="1"/>
      <stop offset="50%"  stop-color="#F0C060" stop-opacity="1"/>
      <stop offset="80%"  stop-color="#C4933A" stop-opacity="1"/>
      <stop offset="100%" stop-color="#C4933A" stop-opacity="0"/>
    </linearGradient>

    <!-- Clip to safe zone for mobile-critical elements -->
    <clipPath id="safeZone">
      <rect x="507" y="509" width="1546" height="422"/>
    </clipPath>

  </defs>

  <!-- ░░ LAYER 1 — BASE BACKGROUND ░░ -->
  <rect width="2560" height="1440" fill="url(#bgGrad)"/>

  <!-- ░░ LAYER 2 — TRACTION TEXTURE (full canvas, very subtle) ░░ -->
  <rect width="2560" height="1440" fill="url(#traction)" opacity="0.55"/>

  <!-- ░░ LAYER 3 — HEAT GLOW centered on safe zone ░░ -->
  <rect x="307" y="309" width="1946" height="822" fill="url(#heatGlow)"/>

  <!-- ░░ LAYER 4 — VERTICAL VIGNETTE ░░ -->
  <rect width="2560" height="1440" fill="url(#vGrad)"/>

  <!-- ════════════════════════════════════════════ -->
  <!--   MOBILE SAFE ZONE: x=507–2053, y=509–931   -->
  <!--   Center: x=1280, y=720                     -->
  <!-- ════════════════════════════════════════════ -->

  <!-- SAFE ZONE GOLD BORDER LINES -->
  <rect x="507" y="511" width="1546" height="2.5" fill="url(#goldLine)" opacity="0.9"/>
  <rect x="507" y="926" width="1546" height="2.5" fill="url(#goldLine)" opacity="0.9"/>

  <!-- Vertical accent ticks at corners of safe zone -->
  <rect x="507"  y="511" width="2.5" height="30" fill="#C4933A" opacity="0.7"/>
  <rect x="507"  y="899" width="2.5" height="30" fill="#C4933A" opacity="0.7"/>
  <rect x="2050" y="511" width="2.5" height="30" fill="#C4933A" opacity="0.7"/>
  <rect x="2050" y="899" width="2.5" height="30" fill="#C4933A" opacity="0.7"/>

  <!-- ── TR BADGE — left anchor of safe zone ── -->
  <!-- Outer ring -->
  <circle cx="700" cy="720" r="148" fill="none" stroke="#C4933A" stroke-width="2.5" opacity="0.6"/>
  <!-- Inner fill -->
  <circle cx="700" cy="720" r="136" fill="#111111"/>
  <!-- Inner ring -->
  <circle cx="700" cy="720" r="130" fill="none" stroke="#C4933A" stroke-width="1" opacity="0.35"/>

  <!-- Herringbone chevrons inside badge -->
  <g opacity="0.25" clip-path="none">
    <polyline points="620,740 700,620 780,740" fill="none" stroke="#C4933A" stroke-width="8" stroke-linejoin="round"/>
    <polyline points="640,790 700,700 760,790" fill="none" stroke="#C4933A" stroke-width="5" stroke-linejoin="round"/>
  </g>

  <!-- TR text -->
  <text x="700" y="746"
    font-family="Impact, Arial Black, sans-serif"
    font-size="100"
    font-weight="900"
    fill="#F2F2F2"
    text-anchor="middle"
    letter-spacing="-4">TR</text>

  <!-- Thin gold underline in badge -->
  <rect x="638" y="760" width="124" height="2" fill="#C4933A" opacity="0.7"/>

  <!-- ── MAIN TITLE ── -->
  <text x="1320" y="693"
    font-family="Impact, Arial Black, sans-serif"
    font-size="108"
    font-weight="900"
    fill="#F2F2F2"
    text-anchor="middle"
    letter-spacing="10">THE TRACTION REPORT</text>

  <!-- Gold divider line under title -->
  <rect x="940" y="710" width="760" height="2" fill="url(#goldLine)"/>

  <!-- ── TAGLINE ── -->
  <text x="1320" y="775"
    font-family="Arial, Helvetica, sans-serif"
    font-size="34"
    font-weight="400"
    fill="#C4933A"
    text-anchor="middle"
    letter-spacing="14">TESTED UNDER PRESSURE</text>

  <!-- ── SUB-LABEL ── -->
  <text x="1320" y="828"
    font-family="Arial, Helvetica, sans-serif"
    font-size="22"
    font-weight="300"
    fill="#666666"
    text-anchor="middle"
    letter-spacing="8">BASKETBALL MOVEMENT LAB</text>

  <!-- ── RIGHT SIDE DESCRIPTOR STACK ── -->
  <!-- Vertical rule -->
  <rect x="1890" y="600" width="1.5" height="240" fill="#C4933A" opacity="0.4"/>

  <text x="1918" y="643"
    font-family="Arial, Helvetica, sans-serif"
    font-size="19"
    font-weight="700"
    fill="#888888"
    text-anchor="start"
    letter-spacing="5">TRACTION</text>

  <text x="1918" y="678"
    font-family="Arial, Helvetica, sans-serif"
    font-size="19"
    font-weight="700"
    fill="#888888"
    text-anchor="start"
    letter-spacing="5">CUSHION</text>

  <text x="1918" y="713"
    font-family="Arial, Helvetica, sans-serif"
    font-size="19"
    font-weight="700"
    fill="#888888"
    text-anchor="start"
    letter-spacing="5">CONTAINMENT</text>

  <text x="1918" y="748"
    font-family="Arial, Helvetica, sans-serif"
    font-size="19"
    font-weight="700"
    fill="#888888"
    text-anchor="start"
    letter-spacing="5">COURT FEEL</text>

  <text x="1918" y="783"
    font-family="Arial, Helvetica, sans-serif"
    font-size="19"
    font-weight="700"
    fill="#888888"
    text-anchor="start"
    letter-spacing="5">RECOVERY</text>

  <text x="1918" y="818"
    font-family="Arial, Helvetica, sans-serif"
    font-size="19"
    font-weight="700"
    fill="#888888"
    text-anchor="start"
    letter-spacing="5">TRUST FACTOR</text>

</svg>
